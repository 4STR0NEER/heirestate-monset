<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f1e8" />
    <!--seo-->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- the page's text is written into the HTML for search engines and readers without scripts;
         with scripts on, the page draws it, so keep it out of sight until it does (no flash of text) -->

    <style>.js .prerender{visibility:hidden}</style>
  </head>

    <div id="root"><!--prerender--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
